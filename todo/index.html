<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"Syne";font-weight:700;font-display:swap;src:url(fonts/syne-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Syne";font-weight:800;font-display:swap;src:url(fonts/syne-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:400;font-display:swap;src:url(fonts/dm-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:500;font-display:swap;src:url(fonts/dm-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:700;font-display:swap;src:url(fonts/dm-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"DM Mono";font-weight:400;font-display:swap;src:url(fonts/dm-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Mono";font-weight:500;font-display:swap;src:url(fonts/dm-mono-latin-500-normal.woff2) format("woff2")}
:root{--bg:#FFFFFF;--card:#FFFFFF;--card2:#F2F2F4;--line:rgba(0,0,0,.09);--ink:#111111;--mu:#777777;
--p0:#B3B0BF;--p1:#2D7FD3;--p2:#F59E0B;--p3:#E5384B;--ok:#22B573;--bad:#E5384B;--acc:#111111;
--disp:"Syne",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);overscroll-behavior-y:none}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px 230px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
h1{font:800 34px/1.05 var(--disp);margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mu);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:0 -16px 18px;padding:calc(env(safe-area-inset-top,0px) + 26px) 16px 22px;background:#111;color:#fff;border-radius:0 0 26px 26px}.top .eyebrow{color:rgba(255,255,255,.7)}.top .sub{color:rgba(255,255,255,.72)}.top .gear{background:#fff;color:#111;border:0}
.gear{min-width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.bar{height:6px;border-radius:6px;background:rgba(0,0,0,.08);overflow:hidden;margin:-4px 0 4px}
.bar i{display:block;height:100%;background:#111;border-radius:6px;transition:width .5s}
.sec{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sec.bad{color:var(--bad)}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid #E6E6E6;border-radius:16px;padding:12px 12px 12px 8px;margin-bottom:8px;cursor:pointer;transition:transform .25s,opacity .3s}
.task.pop{transform:scale(.97);opacity:.4}
.chk{flex:none;width:44px;height:44px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.chk b{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--pc,var(--p0));display:grid;place-items:center;color:transparent;font-size:14px;transition:.2s}
.chk:active b,.task.done .chk b{background:var(--ok);border-color:var(--ok);color:#fff}
.tb{flex:1;min-width:0;padding-top:9px}
.tt{font-weight:500;overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--mu)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:500 11.5px/1 var(--mono);padding:5px 8px;border-radius:99px;background:rgba(0,0,0,.06);color:var(--mu);white-space:nowrap}
.chip.bad{background:rgba(229,56,75,.1);color:var(--bad)}
.chip.today{background:#111;color:#fff}
.chip.tag{color:var(--p1)}
.note{color:var(--mu);font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--mu);padding:46px 10px}
.empty big{display:block;font-size:42px;margin-bottom:8px}
.dock{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 6px);background:linear-gradient(rgba(255,255,255,0),#fff 22%)}
.dock .in{max-width:640px;margin:0 auto}
.prev{display:flex;flex-wrap:wrap;gap:6px;min-height:0;padding:0 4px 8px}
.prev .chip{background:#111;color:#fff}
.add{display:flex;gap:8px;background:#fff;border:1px solid #E0E0E0;border-radius:18px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.07)}
.add input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:16px var(--body);padding:10px 10px;outline:none}
.add input::placeholder{color:var(--mu)}
.add button{flex:none;min-width:46px;height:46px;border:0;border-radius:13px;background:var(--acc);color:#fff;font:800 22px var(--disp);cursor:pointer}
.add button{font-family:var(--body);font-weight:700}.add button.alt{background:rgba(0,0,0,.07);color:var(--ink);font-size:20px;letter-spacing:1px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;min-height:46px;border:0;border-radius:13px;background:transparent;color:var(--mu);font:500 12px var(--body);cursor:pointer;position:relative}
.tab.on{background:rgba(0,0,0,.07);color:var(--ink)}
.tab em{font:500 10px var(--mono);font-style:normal;background:#111;color:#fff;border-radius:99px;padding:2px 6px;margin-left:4px}
.tab em.z{display:none}
.sheet{position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sh{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sh h2{font:800 20px var(--disp);margin:0 0 12px}
label{display:block;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px}
.f{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:16px var(--body);padding:12px;min-height:46px}
textarea.f{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.pill{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:500 14px var(--body);cursor:pointer;flex:none}
.pill.on{background:#111;color:#fff;border-color:#111}
.pill.danger{color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:18px}
.btns .pill{flex:1}
.btns .main{background:#111;color:#fff;border-color:#111;font-weight:700}
.alerts{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.al{background:#fff;border:2px solid #111;border-radius:16px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:in .3s}
@keyframes in{from{transform:translateY(-14px);opacity:0}}
.al b{display:block;margin-bottom:8px}
.al .row .pill{min-height:40px;padding:0 10px;font-size:13px}
.toast{position:fixed;z-index:25;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);background:#111;color:#fff;border-radius:99px;padding:10px 16px;font-weight:500;display:none;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:92vw}
.toast.on{display:flex}
.toast button{border:0;background:none;color:#FFB0CB;font:700 14px var(--body);cursor:pointer;min-height:36px}
.menu p{color:var(--mu);font-size:13px;margin:6px 0 0}
@media(max-width:340px){h1{font-size:28px}.task{gap:6px}}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="alerts" id="alerts"></div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="tundo">Undo</button></div>

<div class="dock"><div class="in">
  <div class="prev" id="prev"></div>
  <form class="add" id="addf" autocomplete="off">
    <input id="q" placeholder="Add a task, e.g. call mum 5pm" enterkeyhint="done" aria-label="New task">
    <button type="button" class="alt" id="more" aria-label="More options">&bull;&bull;&bull;</button>
    <button type="submit" aria-label="Add task">+</button>
  </form>
  <div class="tabs" id="tabs"></div>
</div></div>

<div class="sheet" id="sheet"><div class="sh" id="sh"></div></div>

<script>
(function(){
"use strict";
var KEY="todo-v1";
var DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAYF=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
var S=load(),view="today",editId=null,lastSnap=null,alerts=[],audio=null;

function load(){try{var j=JSON.parse(localStorage.getItem(KEY));if(j&&j.tasks){j.set=j.set||{};if(j.set.sound==null)j.set.sound=true;if(j.set.nag==null)j.set.nag=true;if(!j.set.morning)j.set.morning="09:00";return j}}catch(e){}
  return{tasks:[],set:{sound:true,nag:true,morning:"09:00"}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function p2(n){return(n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function addD(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function todayS(){return ymd(new Date())}
function mins(t){var a=t.split(":");return +a[0]*60+ +a[1]}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function dueMs(t){ if(!t.due)return null; var d=pd(t.due),m=t.time?mins(t.time):mins(S.set.morning); return d.getTime()+m*60000 }
function fmtDay(s){var t=todayS(),d=pd(s);if(s===t)return"Today";if(s===ymd(addD(new Date(),1)))return"Tomorrow";if(s===ymd(addD(new Date(),-1)))return"Yesterday";
  var diff=Math.round((d-pd(t))/864e5);if(diff>0&&diff<7)return DAYN[d.getDay()];return DAYN[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]}
function fmtTime(t){var a=t.split(":"),h=+a[0],m=a[1],ap=h>=12?"pm":"am";h=h%12||12;return h+(m==="00"?"":":"+m)+ap}

/* ---------- natural language ---------- */
function parse(raw){
  var s=" "+raw+" ",o={title:"",due:null,time:null,repeat:"none",pri:0,tags:[]},now=new Date(),m;
  function cut(re){var r=re.exec(s);if(r){s=s.slice(0,r.index)+" "+s.slice(r.index+r[0].length);}return r}
  while((m=cut(/\s#([a-z0-9_]+)(?=\s)/i)))o.tags.push(m[1].toLowerCase());
  if((m=cut(/\s(!{1,3})(?=\s)/)))o.pri=m[1].length;
  else if((m=cut(/\sp([1-3])(?=\s)/i)))o.pri=4-(+m[1]); // p1 = highest
  if((m=cut(/\severy\s+(day|weekday|weekdays|week|month|mon|tue|wed|thu|fri|sat|sun)[a-z]*(?=\s)/i))){var w=m[1].toLowerCase();o.repeat=w==="day"?"daily":(w==="weekday"||w==="weekdays")?"weekdays":w==="month"?"monthly":"weekly";
    var di=DAYN.map(function(x){return x.toLowerCase()}).indexOf(w.slice(0,3));if(di>=0&&w!=="week"&&w!=="weekday"&&w!=="weekdays"&&w!=="day"&&w!=="month"){o.due=nextDow(di,false)}}
  else if((m=cut(/\s(daily|weekly|monthly)(?=\s)/i)))o.repeat=m[1].toLowerCase();
  var rel=cut(/\sin\s+(\d+)\s*(min|mins|minutes|m|hour|hours|hr|hrs|h|day|days|week|weeks)(?=\s)/i);
  if(rel){var n=+rel[1],u=rel[2].toLowerCase();
    if(u.charAt(0)==="m"||u.charAt(0)==="h"){var t=new Date(now.getTime()+n*(u.charAt(0)==="m"?60000:3600000));o.due=ymd(t);o.time=p2(t.getHours())+":"+p2(t.getMinutes())}
    else o.due=ymd(addD(now,n*(u.charAt(0)==="w"?7:1)))}
  if(!o.due){
    if(cut(/\s(tonight)(?=\s)/i)){o.due=ymd(now);o.time="20:00"}
    else if(cut(/\s(today)(?=\s)/i))o.due=ymd(now);
    else if(cut(/\s(tomorrow|tmrw|tmw|tom)(?=\s)/i))o.due=ymd(addD(now,1));
    else if((m=cut(/\snext\s+week(?=\s)/i)))o.due=nextDow(1,true);
    else if((m=cut(/\s(?:on\s+)?(next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues|tue|wed|thurs|thur|thu|fri|sat)(?=\s)/i))){
      var nm=m[2].toLowerCase(),idx=-1;for(var i=0;i<7;i++){if(DAYF[i]===nm||DAYF[i].slice(0,3)===nm.slice(0,3)){idx=i;break}}
      o.due=nextDow(idx,!!m[1])}
    else if((m=cut(/\s(?:on\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?=\s)/i)))o.due=mkDate(+m[1],m[2]);
    else if((m=cut(/\s(?:on\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?(?=\s)/i)))o.due=mkDate(+m[2],m[1]);
    else if((m=cut(/\s(\d{1,2})\/(\d{1,2})(?=\s)/))){var dd=+m[1],mm=+m[2]-1,y=now.getFullYear(),c=new Date(y,mm,dd);if(c<pd(todayS()))c=new Date(y+1,mm,dd);o.due=ymd(c)}
  }
  if(!o.time){
    if((m=cut(/\s(?:at\s+|@\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)(?=\s)/i))){var h=+m[1]%12;if(m[3].toLowerCase()==="pm")h+=12;o.time=p2(h)+":"+(m[2]||"00")}
    else if((m=cut(/\s(?:at\s+|@\s*)?([01]?\d|2[0-3]):([0-5]\d)(?=\s)/))){o.time=p2(+m[1])+":"+m[2]}
    else if((m=cut(/\sat\s+(\d{1,2})(?=\s)/i))){var hh=+m[1];if(hh>=1&&hh<=6)hh+=12;if(hh<24)o.time=p2(hh)+":00"}
    else if(cut(/\s(this\s+)?morning(?=\s)/i))o.time="09:00";
    else if(cut(/\s(this\s+)?afternoon(?=\s)/i))o.time="14:00";
    else if(cut(/\s(this\s+)?evening(?=\s)/i))o.time="18:00";
  }
  if(o.time&&!o.due){var t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),mm0=mins(o.time);o.due=ymd(now.getHours()*60+now.getMinutes()<mm0?t0:addD(t0,1))}
  if(o.repeat!=="none"&&!o.due)o.due=ymd(now);
  o.title=s.replace(/\s+(on|at|by|for|in)\s*$/i,"").replace(/^\s*(on|at|by)\s+/i,"").replace(/\s+/g," ").trim();
  return o}
function mkDate(d,mon){var mi=MON.map(function(x){return x.toLowerCase()}).indexOf(mon.toLowerCase().slice(0,3)),y=new Date().getFullYear(),c=new Date(y,mi,d);if(c<pd(todayS()))c=new Date(y+1,mi,d);return ymd(c)}
function nextDow(idx,forceNext){var n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),diff=(idx-t.getDay()+7)%7;if(diff===0)diff=7;if(forceNext&&diff<7&&idx!==1&&false)diff+=7;return ymd(addD(t,diff))}
function chipsFor(o){var c=[];if(o.due)c.push(fmtDay(o.due));if(o.time)c.push(fmtTime(o.time));if(o.repeat!=="none")c.push("repeats "+o.repeat);if(o.pri)c.push("!".repeat(o.pri)+" priority");o.tags.forEach(function(t){c.push("#"+t)});return c}

/* ---------- task helpers ---------- */
function mk(o){var t={id:uid(),title:o.title,notes:o.notes||"",due:o.due||"",time:o.time||"",doOn:o.doOn||"",pri:o.pri||0,repeat:o.repeat||"none",tags:o.tags||[],remind:null,done:false,doneAt:0,created:Date.now(),fired:{},extra:[],lastFire:0};
  t.remind=o.remind||(t.time?[30,0]:[0]);return t}
function active(){return S.tasks.filter(function(t){return!t.done})}
function overdue(t){var d=dueMs(t);if(d==null)return false;if(t.time)return d<Date.now();return t.due<todayS()}
function inToday(t){var td=todayS();return(t.due&&t.due<=td)||(t.doOn&&t.doOn<=td)}
function byDue(a,b){return(dueMs(a)||9e15)-(dueMs(b)||9e15)||b.pri-a.pri}
function nextDue(t){var td=todayS(),d=pd(t.due||td),n=d;
  function step(x){if(t.repeat==="daily")return addD(x,1);if(t.repeat==="weekly")return addD(x,7);if(t.repeat==="monthly")return new Date(x.getFullYear(),x.getMonth()+1,x.getDate());
    var y=addD(x,1);while(y.getDay()===0||y.getDay()===6)y=addD(y,1);return y}
  do{n=step(n)}while(ymd(n)<=td);return ymd(n)}
function snap(){lastSnap=JSON.stringify(S.tasks)}
function toast(msg,undo){$("tmsg").textContent=msg;$("tundo").style.display=undo?"":"none";$("toast").classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){$("toast").classList.remove("on")},undo?6000:2500)}
function complete(id){var t=find(id);if(!t)return;snap();
  if(t.repeat!=="none"&&t.due){var nx=JSON.parse(JSON.stringify(t));nx.id=uid();nx.due=nextDue(t);nx.fired={};nx.extra=[];nx.lastFire=0;nx.created=Date.now();if(t.doOn)nx.doOn="";S.tasks.push(nx);toast("Done. Next: "+fmtDay(nx.due),true)}
  else toast("Done. Nice one.",true);
  t.done=true;t.doneAt=Date.now();dismissAlert(id);save();render()}
function find(id){for(var i=0;i<S.tasks.length;i++)if(S.tasks[i].id===id)return S.tasks[i]}

/* ---------- render ---------- */
function taskHtml(t,ctx){
  var c=["chip"],meta=[];
  if(t.due){var od=overdue(t);meta.push('<span class="chip '+(od?"bad":t.due===todayS()?"today":"")+'">'+(od&&t.due<todayS()?"Overdue · ":"")+esc(fmtDay(t.due))+(t.time?" · "+fmtTime(t.time):"")+"</span>")}
  if(t.doOn&&t.doOn!==t.due)meta.push('<span class="chip">Do '+esc(fmtDay(t.doOn))+"</span>");
  if(t.repeat!=="none")meta.push('<span class="chip">↻ '+esc(t.repeat)+"</span>");
  t.tags.forEach(function(g){meta.push('<span class="chip tag">#'+esc(g)+"</span>")});
  var col=["var(--p0)","var(--p1)","var(--p2)","var(--p3)"][t.pri];
  return '<div class="task'+(t.done?" done":"")+'" data-id="'+t.id+'"><button class="chk" data-chk="'+t.id+'" aria-label="'+(t.done?"Mark not done":"Mark done")+'" style="--pc:'+col+'"><b>✓</b></button><div class="tb"><div class="tt">'+esc(t.title)+"</div>"+(t.notes?'<div class="note">'+esc(t.notes.length>90?t.notes.slice(0,90)+"…":t.notes)+"</div>":"")+(meta.length?'<div class="meta">'+meta.join("")+"</div>":"")+"</div></div>"}
function list(arr){return arr.map(taskHtml).join("")}
function greet(){var h=new Date().getHours();return h<5?"Late night":h<12?"Good morning":h<18?"Good afternoon":"Good evening"}
function render(){
  var a=active(),td=todayS(),h="",doneToday=S.tasks.filter(function(t){return t.done&&t.doneAt&&ymd(new Date(t.doneAt))===td}).length;
  var todayT=a.filter(inToday).sort(byDue),od=todayT.filter(overdue),rest=todayT.filter(function(t){return!overdue(t)});
  var up=a.filter(function(t){return t.due&&t.due>td&&!(t.doOn&&t.doOn<=td)}).sort(byDue),inbox=a.filter(function(t){return!t.due&&!t.doOn}).sort(function(x,y){return y.pri-x.pri||y.created-x.created});
  var done=S.tasks.filter(function(t){return t.done}).sort(function(x,y){return y.doneAt-x.doneAt});
  if(view==="today"){
    var tot=todayT.length+doneToday;
    h+='<div class="top"><div><div class="eyebrow">'+esc(DAYN[new Date().getDay()]+" "+new Date().getDate()+" "+MON[new Date().getMonth()])+'</div><h1>'+greet()+'</h1><div class="sub">'+(todayT.length?todayT.length+" to do today":"Nothing left today")+(doneToday?" · "+doneToday+" done":"")+'</div></div><button class="gear" id="gear" aria-label="Settings">⚙</button></div>';
    h+='<div class="bar"><i style="width:'+(tot?Math.round(doneToday/tot*100):0)+'%"></i></div>';
    if(od.length)h+='<div class="sec bad"><span>Overdue · '+od.length+"</span></div>"+list(od);
    if(rest.length)h+='<div class="sec"><span>Today</span></div>'+list(rest);
    if(!todayT.length)h+='<div class="empty"><big>'+(doneToday?"🎉":"✨")+"</big>"+(doneToday?"All clear. Great work.":"Type a task below to get started.")+"</div>";
  }else{
    var title={upcoming:"Upcoming",inbox:"Inbox",done:"Done"}[view];
    h+='<div class="top"><div><div class="eyebrow">'+({upcoming:"Coming up",inbox:"No date yet",done:"Finished"}[view])+'</div><h1>'+title+'</h1></div><button class="gear" id="gear" aria-label="Settings">⚙</button></div>';
    if(view==="upcoming"){var last="";up.forEach(function(t){if(t.due!==last){last=t.due;h+='<div class="sec"><span>'+esc(fmtDay(t.due))+"</span></div>"}h+=taskHtml(t)});if(!up.length)h+='<div class="empty"><big>📅</big>Nothing coming up. Add a task with a date.</div>'}
    if(view==="inbox"){h+=(inbox.length?'<div class="sub" style="margin:-4px 2px 8px">Quick thoughts land here. Tap one to give it a date.</div>':"")+list(inbox);if(!inbox.length)h+='<div class="empty"><big>📥</big>Inbox is empty.</div>'}
    if(view==="done"){h+=list(done.slice(0,80));if(!done.length)h+='<div class="empty"><big>✅</big>Finished tasks show here.</div>';else h+='<div class="btns"><button class="pill danger" id="clr">Clear done tasks</button></div>'}
  }
  $("app").innerHTML=h;
  var cnt={today:todayT.length,upcoming:up.length,inbox:inbox.length,done:0};
  $("tabs").innerHTML=[["today","Today"],["upcoming","Upcoming"],["inbox","Inbox"],["done","Done"]].map(function(x){return'<button class="tab'+(view===x[0]?" on":"")+'" data-tab="'+x[0]+'">'+x[1]+'<em class="'+(cnt[x[0]]?"":"z")+'">'+cnt[x[0]]+"</em></button>"}).join("");
}

/* ---------- sheet ---------- */
function openEdit(id){var t=find(id);if(!t)return;editId=id;$("toast").classList.remove("on");
  var rem=[[0,"At time"],[10,"10 min"],[30,"30 min"],[60,"1 hour"],[1440,"1 day"]];
  var h='<h2>Edit task</h2><label for="e_t">Task</label><input class="f" id="e_t" value="'+esc(t.title)+'"><label for="e_n">Notes</label><textarea class="f" id="e_n">'+esc(t.notes)+'</textarea>'
  +'<label>Due</label><div class="row"><input class="f" type="date" id="e_d" value="'+esc(t.due)+'" aria-label="Due date"><input class="f" type="time" id="e_tm" value="'+esc(t.time)+'" aria-label="Due time"></div>'
  +'<div class="row" style="margin-top:8px"><button class="pill" data-q="0">Today</button><button class="pill" data-q="1">Tomorrow</button><button class="pill" data-q="7">Next week</button><button class="pill" data-q="x">No date</button></div>'
  +'<label for="e_do">Do on (when you plan to do it)</label><input class="f" type="date" id="e_do" value="'+esc(t.doOn)+'">'
  +'<label>Priority</label><div class="row" id="e_p">'+["None","Low","Medium","High"].map(function(n,i){return'<button class="pill'+(t.pri===i?" on":"")+'" data-pri="'+i+'">'+n+"</button>"}).join("")+"</div>"
  +'<label for="e_r">Repeat</label><select class="f" id="e_r">'+["none","daily","weekdays","weekly","monthly"].map(function(r){return'<option value="'+r+'"'+(t.repeat===r?" selected":"")+">"+(r==="none"?"Doesn\u2019t repeat":r)+"</option>"}).join("")+"</select>"
  +'<label>Remind me</label><div class="row" id="e_rem">'+rem.map(function(r){return'<button class="pill'+(t.remind.indexOf(r[0])>=0?" on":"")+'" data-rem="'+r[0]+'">'+r[1]+"</button>"}).join("")+"</div>"
  +'<label for="e_g">Tags</label><input class="f" id="e_g" placeholder="e.g. work, home" value="'+esc(t.tags.join(", "))+'">'
  +'<div class="btns"><button class="pill danger" id="e_del">Delete</button><button class="pill main" id="e_save">Save</button></div>';
  $("sh").innerHTML=h;$("sheet").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on");editId=null}
function saveEdit(){var t=find(editId);if(!t)return;snap();var v=$("e_t").value.trim();if(v)t.title=v;t.notes=$("e_n").value.trim();t.due=$("e_d").value;t.time=t.due?$("e_tm").value:"";t.doOn=$("e_do").value;
  var pr=document.querySelector("#e_p .on");t.pri=pr?+pr.getAttribute("data-pri"):0;t.repeat=$("e_r").value;
  t.remind=[].slice.call(document.querySelectorAll("#e_rem .on")).map(function(b){return+b.getAttribute("data-rem")});t.fired={};t.extra=[];
  t.tags=$("e_g").value.split(/[,\s]+/).map(function(x){return x.replace(/^#/,"").toLowerCase()}).filter(Boolean);save();closeSheet();render()}

function openMenu(){$("toast").classList.remove("on");var perm=("Notification"in window)?Notification.permission:"unsupported";
  var n=S.tasks.filter(function(t){return!t.done&&t.due}).length;
  $("sh").innerHTML='<div class="menu"><h2>Settings</h2>'
  +'<label>Reminders</label><button class="pill" id="m_ics" style="width:100%">Send my reminders to Calendar ('+n+')</button><p>The reliable way. Your phone\u2019s calendar rings even when this app is closed. Run it again after you add tasks.</p>'
  +'<button class="pill" id="m_notif" style="width:100%;margin-top:10px">'+(perm==="granted"?"Notifications are on ✓":perm==="denied"?"Notifications blocked in phone settings":perm==="unsupported"?"Notifications not supported here":"Turn on notifications")+'</button><p>These alert you while the app is open or recently used.</p>'
  +'<label>Options</label><div class="row"><button class="pill'+(S.set.sound?" on":"")+'" id="m_snd">Sound</button><button class="pill'+(S.set.nag?" on":"")+'" id="m_nag">Nag when overdue</button></div>'
  +'<label for="m_mor">Morning reminder time (tasks with no time)</label><input class="f" type="time" id="m_mor" value="'+esc(S.set.morning)+'">'
  +'<label>Your data</label><div class="row"><button class="pill" id="m_exp">Back up</button><button class="pill" id="m_imp">Restore</button></div><p>Tasks are stored on this phone only. Back up now and then.</p>'
  +'<div class="btns"><button class="pill main" id="m_close">Done</button></div></div>';$("sheet").classList.add("on")}

/* ---------- reminders ---------- */
function ensureAudio(){try{if(!audio){var C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}if(audio&&audio.state==="suspended")audio.resume()}catch(e){}}
function beep(){if(!S.set.sound||!audio)return;try{[0,0.22,0.44].forEach(function(dt,i){var o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.value=i===1?1100:880;g.gain.setValueAtTime(0.0001,audio.currentTime+dt);g.gain.exponentialRampToValueAtTime(0.25,audio.currentTime+dt+0.02);g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+dt+0.2);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+dt);o.stop(audio.currentTime+dt+0.22)})}catch(e){}}
function fireTimes(t){var d=dueMs(t),out=[];if(d!=null)t.remind.forEach(function(m){out.push(d-m*60000)});(t.extra||[]).forEach(function(x){out.push(x)});return out}
function notify(t,body){
  if("Notification"in window&&Notification.permission==="granted"&&navigator.serviceWorker){navigator.serviceWorker.ready.then(function(r){r.showNotification(t.title,{body:body,tag:t.id,icon:"icon-192.png",vibrate:[250,120,250,120,250],renotify:true})}).catch(function(){})}
  if(navigator.vibrate)try{navigator.vibrate([250,120,250])}catch(e){}}
function bodyFor(t){return t.due?(fmtDay(t.due)+(t.time?" at "+fmtTime(t.time):"")):"Reminder"}
function addAlert(t,nag){if(alerts.indexOf(t.id)<0)alerts.push(t.id);renderAlerts();beep();notify(t,(nag?"Still to do · ":"")+bodyFor(t))}
function dismissAlert(id){var i=alerts.indexOf(id);if(i>=0){alerts.splice(i,1);renderAlerts()}}
function renderAlerts(){$("alerts").innerHTML=alerts.map(function(id){var t=find(id);if(!t)return"";
  return'<div class="al" data-al="'+id+'"><b>⏰ '+esc(t.title)+'</b><div class="sub" style="margin:-4px 0 8px">'+esc(bodyFor(t))+'</div><div class="row"><button class="pill main" style="background:#111;color:#fff;border-color:#111" data-ad="'+id+'">Done</button><button class="pill" data-sn="10" data-id="'+id+'">+10 min</button><button class="pill" data-sn="60" data-id="'+id+'">+1 hr</button><button class="pill" data-ax="'+id+'">Dismiss</button></div></div>'}).join("")}
function tick(){var now=Date.now(),ch=false;
  S.tasks.forEach(function(t){if(t.done)return;fireTimes(t).forEach(function(ft){var k=String(ft);if(ft<=now&&!t.fired[k]){t.fired[k]=1;ch=true;if(now-ft<30*60000){t.lastFire=now;addAlert(t,false)}}});
    if(S.set.nag&&t.time&&overdue(t)&&alerts.indexOf(t.id)<0&&t.lastFire&&now-t.lastFire>15*60000&&now-dueMs(t)<6*3600000){t.lastFire=now;ch=true;addAlert(t,true)}});
  if(ch){save();render()}}
function snooze(id,m){var t=find(id);if(!t)return;t.extra=t.extra||[];t.extra.push(Date.now()+m*60000);dismissAlert(id);save();toast("Snoozed "+(m>=60?m/60+" hr":m+" min"))}

function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function exportIcs(){var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//My To-do//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:My to-do"],st=new Date().toISOString().replace(/[-:]|\.\d{3}/g,""),n=0;
  var RR={daily:"FREQ=DAILY",weekdays:"FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR",weekly:"FREQ=WEEKLY",monthly:"FREQ=MONTHLY"};
  S.tasks.forEach(function(t){if(t.done||!t.due)return;n++;var d=t.due.replace(/-/g,"");
    L.push("BEGIN:VEVENT","UID:todo-"+t.id+"@my-todo","DTSTAMP:"+st);
    if(t.time){var m=mins(t.time),e=m+15;L.push("DTSTART:"+d+"T"+t.time.replace(":","")+"00","DTEND:"+d+"T"+p2(Math.floor(e/60)%24)+p2(e%60)+"00")}
    else{L.push("DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+ymd(addD(pd(t.due),1)).replace(/-/g,""))}
    L.push("SUMMARY:"+icsEsc("To do: "+t.title));if(t.notes)L.push("DESCRIPTION:"+icsEsc(t.notes));if(RR[t.repeat])L.push("RRULE:"+RR[t.repeat]);
    var base=t.time?0:mins(S.set.morning);(t.remind.length?t.remind:[0]).forEach(function(r){var tot=base-r;
      L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(t.title),t.time?("TRIGGER:-PT"+r+"M"):(tot>=0?"TRIGGER;RELATED=START:PT"+tot+"M":"TRIGGER;RELATED=START:-PT"+(-tot)+"M"),"END:VALARM")});
    L.push("END:VEVENT")});
  L.push("END:VCALENDAR");
  if(!n){toast("No dated tasks to send yet");return}
  dl("todo-reminders.ics","text/calendar",L.join("\r\n")+"\r\n");toast("Calendar file ready. Open it and tap Add All.")}
function dl(name,type,text){var b=new Blob([text],{type:type}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}

/* ---------- events ---------- */
function addFromInput(){var v=$("q").value.trim();if(!v)return;var o=parse(v);if(!o.title){o.title=v}snap();var t=mk(o);S.tasks.push(t);save();$("q").value="";$("prev").innerHTML="";
  if(o.due){view=o.due<=todayS()?"today":"upcoming"}else view="inbox";render();toast("Added"+(o.due?" · "+fmtDay(o.due)+(o.time?" "+fmtTime(o.time):""):" to Inbox"),true)}
$("addf").addEventListener("submit",function(e){e.preventDefault();ensureAudio();addFromInput()});
$("q").addEventListener("input",function(){var v=this.value.trim();$("prev").innerHTML=v?chipsFor(parse(v)).map(function(c){return'<span class="chip">'+esc(c)+"</span>"}).join(""):""});
$("more").addEventListener("click",function(){var v=$("q").value.trim();if(!v){openMenu();return}ensureAudio();var o=parse(v);snap();var t=mk(o.title?o:{title:v});S.tasks.push(t);save();$("q").value="";$("prev").innerHTML="";render();openEdit(t.id)});
$("tundo").addEventListener("click",function(){if(lastSnap){S.tasks=JSON.parse(lastSnap);lastSnap=null;save();render();$("toast").classList.remove("on")}});
$("tabs").addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(b){view=b.getAttribute("data-tab");render();window.scrollTo(0,0)}});
$("app").addEventListener("click",function(e){ensureAudio();
  var c=e.target.closest("[data-chk]");if(c){var id=c.getAttribute("data-chk"),t=find(id);if(!t)return;if(t.done){snap();t.done=false;t.doneAt=0;save();render()}else{var row=c.closest(".task");if(row)row.classList.add("pop");setTimeout(function(){complete(id)},180)}return}
  if(e.target.id==="gear"){openMenu();return}if(e.target.id==="clr"){snap();S.tasks=S.tasks.filter(function(t){return!t.done});save();render();toast("Cleared",true);return}
  var r=e.target.closest(".task");if(r)openEdit(r.getAttribute("data-id"))});
$("alerts").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-ad"))complete(b.getAttribute("data-ad"));else if(b.hasAttribute("data-sn"))snooze(b.getAttribute("data-id"),+b.getAttribute("data-sn"));else if(b.hasAttribute("data-ax"))dismissAlert(b.getAttribute("data-ax"))});
$("sheet").addEventListener("click",function(e){var el=e.target;if(el.id==="sheet"){closeSheet();return}var b=el.closest("button");if(!b)return;
  if(b.hasAttribute("data-q")){var q=b.getAttribute("data-q");$("e_d").value=q==="x"?"":ymd(addD(new Date(),+q));if(q==="x")$("e_tm").value="";return}
  if(b.hasAttribute("data-pri")){[].forEach.call(document.querySelectorAll("#e_p .pill"),function(x){x.classList.remove("on")});b.classList.add("on");return}
  if(b.hasAttribute("data-rem")){b.classList.toggle("on");return}
  if(b.id==="e_save")saveEdit();else if(b.id==="e_del"){snap();S.tasks=S.tasks.filter(function(t){return t.id!==editId});save();closeSheet();render();toast("Deleted",true)}
  else if(b.id==="m_close")closeSheet();else if(b.id==="m_ics"){exportIcs()}
  else if(b.id==="m_notif"){ensureAudio();if("Notification"in window&&Notification.permission==="default"){Notification.requestPermission().then(function(){openMenu()})}else openMenu()}
  else if(b.id==="m_snd"){S.set.sound=!S.set.sound;save();if(S.set.sound){ensureAudio();beep()}openMenu()}
  else if(b.id==="m_nag"){S.set.nag=!S.set.nag;save();openMenu()}
  else if(b.id==="m_exp"){dl("todo-backup-"+todayS()+".json","application/json",JSON.stringify(S,null,1));toast("Backup saved")}
  else if(b.id==="m_imp"){var f=document.createElement("input");f.type="file";f.accept=".json,application/json";f.onchange=function(){var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j.tasks)throw 0;snap();S=j;S.set=S.set||{};if(S.set.sound==null)S.set.sound=true;if(S.set.nag==null)S.set.nag=true;if(!S.set.morning)S.set.morning="09:00";save();closeSheet();render();toast("Restored "+S.tasks.length+" tasks")}catch(e){toast("That file didn't work")}};r.readAsText(f.files[0])};f.click()}});
$("sheet").addEventListener("change",function(e){if(e.target.id==="m_mor"&&e.target.value){S.set.morning=e.target.value;save()}});
document.addEventListener("visibilitychange",function(){if(!document.hidden){tick();render()}});

if(navigator.storage&&navigator.storage.persist)try{navigator.storage.persist()}catch(e){}
if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
window.__todo={parse:parse,S:function(){return S},mk:mk,render:render,tick:tick};
render();tick();setInterval(tick,20000);
})();
</script>
</body>
