<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Week</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Week">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@font-face{font-family:"DM Sans";font-weight:500;font-display:swap;src:url(todo/fonts/dm-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:700;font-display:swap;src:url(todo/fonts/dm-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"DM Mono";font-weight:500;font-display:swap;src:url(todo/fonts/dm-mono-latin-500-normal.woff2) format("woff2")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;font:15px/1.4 "DM Sans",system-ui,-apple-system,sans-serif}
#top{flex:none;height:env(safe-area-inset-top,0px);background:#111}
#frames{flex:1;position:relative;min-height:0;background:#fff}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#frames iframe.on{display:block}
#bar{flex:none;display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 8px);background:#fff;border-top:1px solid rgba(0,0,0,.08)}
.sw{flex:1;display:flex;background:#F2F2F4;border-radius:18px;padding:4px;gap:2px}
.sw button{flex:1;min-height:50px;border:0;border-radius:14px;background:transparent;font:700 14px "DM Sans",system-ui,sans-serif;color:#777;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sw button.on{background:#111;color:#fff}
.sw em{font:500 10px "DM Mono",ui-monospace,monospace;font-style:normal;background:#111;color:#fff;border-radius:99px;padding:2px 6px}
.sw button.on em{background:#fff;color:#111}
.sw em.z{display:none}
#plus{flex:none;width:58px;border:0;border-radius:18px;background:#111;color:#fff;font:700 28px "DM Sans",system-ui,sans-serif;cursor:pointer}
button:focus-visible{outline:2px solid #888;outline-offset:2px}
</style>
</head>
<body>
<div id="top"></div>
<div id="frames">
  <iframe id="f-timetable" title="Timetable" data-src="timetable/"></iframe>
  <iframe id="f-todo" title="To-do" data-src="todo/"></iframe>
  <iframe id="f-gym" title="Gym" data-src="gym/"></iframe>
</div>
<div id="bar">
  <div class="sw" role="tablist" aria-label="Sections">
    <button role="tab" data-t="timetable">Timetable</button>
    <button role="tab" data-t="todo">To-do <em id="cnt" class="z">0</em></button>
    <button role="tab" data-t="gym">Gym</button>
  </div>
  <button id="plus" aria-label="Add a to-do">+</button>
</div>
<script>
(function(){
var TABS=["timetable","todo","gym"],cur="timetable";
function $(i){return document.getElementById(i)}
function show(t){
  if(TABS.indexOf(t)<0)t="timetable";cur=t;
  TABS.forEach(function(x){
    var f=$("f-"+x);if(!f.src)f.src=f.getAttribute("data-src");
    f.classList.toggle("on",x===t);
  });
  [].forEach.call(document.querySelectorAll(".sw button"),function(b){var on=b.getAttribute("data-t")===t;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});
  $("top").style.background=t==="gym"?"#0C0C11":"#111";
  try{localStorage.setItem("mw-tab",t)}catch(e){}
  try{history.replaceState(null,"","#"+t)}catch(e){}
}
document.querySelector(".sw").addEventListener("click",function(e){var b=e.target.closest("button");if(b)show(b.getAttribute("data-t"))});
$("plus").addEventListener("click",function(){
  show("todo");var f=$("f-todo");
  function go(){try{f.contentWindow.postMessage({t:"add"},"*")}catch(e){}}
  go();setTimeout(go,300);
});
function count(){
  try{
    var j=JSON.parse(localStorage.getItem("todo-v1")),n=0,d=new Date(),td=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    if(j&&j.tasks)j.tasks.forEach(function(t){if(!t.done&&((t.due&&t.due<=td)||(t.doOn&&t.doOn<=td)))n++});
    var c=$("cnt");c.textContent=n;c.className=n?"":"z";
  }catch(e){}
}
window.addEventListener("storage",function(e){if(e.key==="todo-v1")count()});
setInterval(count,15000);count();
var start=location.hash.replace("#","");
if(TABS.indexOf(start)<0){try{start=localStorage.getItem("mw-tab")||"timetable"}catch(e){start="timetable"}}
show(start);
// load the other tabs a moment later so everything is ready offline
setTimeout(function(){TABS.forEach(function(x){var f=$("f-"+x);if(!f.src)f.src=f.getAttribute("data-src")})},1500);
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
</body>
</html>
